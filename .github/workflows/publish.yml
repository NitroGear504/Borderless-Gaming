name: publish Borderless Gaming

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"

jobs:
  publish:
    name: Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: "8.0.x"
          include-prerelease: true

      - name: Install bebopc
        shell: pwsh
        run: |
          $version = '2.7.4'
          $script = irm "https://bebop.sh"
          & ([scriptblock]::Create($script)) -bebopcVersion $version

      - name: Add bebopc to PATH
        shell: pwsh
        run: echo "$env:USERPROFILE\AppData\Local\Bebop\bin" | Out-File -Encoding utf8 -Append $env:GITHUB_PATH

      - name: Verify bebopc is available
        shell: pwsh
        run: bebopc --version

      - name: Build release
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: ./Installers/BorderlessGaming${{ env.RELEASE_VERSION }}_admin_setup.exe

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Borderless Gaming ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.crea_
